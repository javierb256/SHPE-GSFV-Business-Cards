<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHPE-GSFV Treasurer</title>
    <link rel="stylesheet" href="styles5.css" />
  </head>
  <body>
    <header>
      <img
        id="banner-image"
        src="./assets/banner-with-text.png"
        alt="San Fernando Valley image"
      />
    </header>
    <div class="container">
      <h1>Felipe Contreras</h1>
      <h2>Treasurer</h2>
      <p>
        Helping companies grow through clear strategy and effective execution
      </p>
      <button id="save-contact-btn">Save Contact</button>

      <div class="socials">
        <!-- Website Container -->
        <a
          class="social-container"
          href="https://shpe-gsfv.org/"
          target="_blank"
        >
          <img src="./assets/globe-64px.png" alt="Internet icon" />
          <div class="details">
            <h3>SHPE-GSFV Website</h3>
            <p>https://shpe-gsfv.org/</p>
          </div>
        </a>
        <!-- LinkedIn container -->
        <a
          class="social-container"
          href="https://www.linkedin.com/in/felipe-contreras-38349116/"
          target="_blank"
        >
          <img src="./assets/linkedin-64px.png" alt="LinkedIn icon" />
          <div class="details">
            <h3>LinkedIn</h3>
            <p>felipe-contreras-38349116</p>
          </div>
        </a>
        <!-- Email container -->
        <a class="social-container" href="mailto:treasurer@shpe-gsfv.org">
          <img src="./assets/email-64px.png" alt="Email icon" />
          <div class="details">
            <h3>Email</h3>
            <p>treasurer@shpe-gsfv.org</p>
          </div>
        </a>
      </div>
    </div>
    <video autoplay muted loop id="bgvideo">
      <source src="./assets/valley-footage.mp4" type="video/mp4" />
    </video>
    <script>
      document
        .getElementById("save-contact-btn")
        .addEventListener("click", function () {
          const vCardData = `BEGIN:VCARD
            VERSION:3.0
            FN: Felipe Contreras
            ORG:SHPE GSFV
            TITLE:Treasurer
            EMAIL:treasurer@shpe-gsfv.org
            URL:www.shpe-gsfv.org
            End:VCARD`;

          const blob = new Blob([vCardData], { type: "text/vcard" });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "Felipe_Contreras.vcf";
          document.body.appendChild(link);
          link.click();

          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        });
    </script>
    <style>
      .container {
        margin-top: -2rem;
        backdrop-filter: blur(1px);
      }
    </style>
  </body>
</html>
