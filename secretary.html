<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design 3</title>
    <link rel="stylesheet" href="styles5.css" />
  </head>
  <body>
    <header>
      <img
        id="banner-image"
        src="./assets/banner-with-text.png"
        alt="San Fernando Valley image"
      />
    </header>
    <div class="container">
      <img src="./assets/francisco-circle-200.png" />
      <h1>Francisco Rangel</h1>
      <h2>Secretary</h2>
      <button id="save-contact-btn">Save Contact</button>

      <div class="socials">
        <!-- Email container -->
        <a class="social-container" href="mailto:secretary@shpe-gsfv.org">
          <img src="./assets/email-64px.png" alt="Email icon" />
          <div class="details">
            <h3>Email</h3>
            <p>secretary@shpe-gsfv.org</p>
          </div>
        </a>
        <!-- Website Container -->
        <a
          class="social-container"
          href="https://shpe-gsfv.org/"
          target="_blank"
        >
          <img src="./assets/globe-64px.png" alt="Internet icon" />
          <div class="details">
            <h3>SHPE-GSFV Website</h3>
            <p>https://shpe-gsfv.org/</p>
          </div>
        </a>
        <!-- LinkedIn container -->
        <a class="social-container" href="" target="_blank">
          <img src="./assets/linkedin-64px.png" alt="LinkedIn icon" />
          <div class="details">
            <h3>LinkedIn</h3>
            <p>francisco-rangel-6493002</p>
          </div>
        </a>
        <!-- Instagram Container -->
        <a
          class="social-container"
          href="https://www.instagram.com/secretaryshpegsfv?stkn=MXdhbzM5cnltNmhleQ%3D%3D&utm_source=qr"
          target="_blank"
        >
          <img src="./assets/instagram-square-64px.png" alt="Instagram icon" />
          <div class="details">
            <h3>Instagram</h3>
            <p>francisco-rangel-6493002</p>
          </div>
        </a>
      </div>
    </div>
    <video autoplay muted loop id="bgvideo">
      <source src="./assets/valley-footage.mp4" type="video/mp4" />
    </video>
    <script>
      document
        .getElementById("save-contact-btn")
        .addEventListener("click", function () {
          const vCardData = `BEGIN:VCARD
            VERSION:3.0
            FN: Francisco Rangel
            ORG:SHPE GSFV
            TITLE:Secretary
            EMAIL:secretary@shpe-gsfv.org
            URL:www.shpe-gsfv.org
            End:VCARD`;

          const blob = new Blob([vCardData], { type: "text/vcard" });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "Dominic_Gallardo.vcf";
          document.body.appendChild(link);
          link.click();

          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        });
    </script>
    <style>
      header > img {
        width: 100%;
        aspect-ratio: 16 / 5;
        object-fit: cover;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </body>
</html>
