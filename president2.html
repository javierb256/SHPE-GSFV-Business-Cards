
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
    <title>President</title>
</head>
<body>
    <div class="container">
        <!-- <img 
        src="./assets/dominic-circle-profile.png" 
        srcset="./assets/dominic-circle-profile-150.png 150w, ./assets/dominic-circle-profile.png 396w"
        sizes="(max-width: 396px) 100vw, 396px"
        alt="Profile Picture"> -->
        <img src="./assets/dominic-circle-profile-180.png">
        <h1>Dominic Gallardo</h1>
        <h2>President</h2>
        <p>Helping companies grow through clear strategy and effective execution</p>
        <button id="save-contact-btn">Save Contact</button>

        <div class="socials">
        <!-- Phone number container -->
            <a class="social-container" href="tel:+15551234567">
                <img src="./assets/mobile.png" alt="Phone icon"> 
                <div class="details">
                    <h3>Call me</h3>
                    <p>+1 (555) 123-4567</p>
                </div>
            </a>
            <!-- Website Container -->
            <a class="social-container" href="https://shpe-gsfv.org/" target="_blank">
                <img src="./assets/globe-64px.png" alt="Internet icon"> 
                <div class="details">
                    <h3>SHPE-GSFV Website</h3>
                    <p>https://shpe-gsfv.org/</p>
                </div>   
            </a>
            <!-- LinkedIn container -->
            <a class="social-container" href="https://www.linkedin.com/in/dominic-gallardo/" target="_blank">
                <img src="./assets/linkedin-64px.png" alt="LinkedIn icon"> 
                <div class="details">
                    <h3>LinkedIn</h3>
                    <p>dominic-gallardo/</p>
                </div>   
            </a>
            <!-- Email container -->
            <a class="social-container" href="mailto:president@shpe-gsfv.org">
                <img src="./assets/email-64px.png" alt="Email icon"> 
                <div class="details">
                    <h3>Email</h3>
                    <p>president@shpe-gsfv.org</p>
                </div>   
            </a>
        </div>
    </div>
    <a href="./index.html" class="custom-button">Other Designs</a>
    <video autoplay muted loop id="bgvideo">
        <source src="./assets/stars.mp4" type="video/mp4">
    </video>
   <script>
        document.getElementById('save-contact-btn').addEventListener('click', function() {
            const vCardData = 
            `BEGIN:VCARD
            VERSION:3.0
            FN: Dominic Gallardo
            ORG:SHPE GSFV
            TITLE:President
            TEL;TYPE=CELL:+1-555-123-4567
            TEL;TYPE=WORK:+1-555-123-4567
            EMAIL:president@shpe-gsfv.org
            URL:www.shpe-gsfv.org
            End:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard' });

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Dominic_Gallardo.vcf';
            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        })
   </script>
    <style>
         .custom-button {
        background: none;
        width: 70%;
        background-color: rgb(17, 115, 236);
        color: white;
        text-align: center;
        padding: 0.5rem 1rem;
        border-radius: 7px;
        text-decoration: none;
        font-size: 1.2rem;
        margin-top:1.5rem;
    }
    </style>
</body>
</html>
