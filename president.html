
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>President</title>
</head>
<body>
    <div class="container">
        <img src="./assets/dominic-circle-profile.png" alt="Profile Picture">
        <h1>Dominic Gallardo</h1>
        <h2>President</h2>
        <p>Helping companies grow through clear strategy and effective execution</p>
        <button id="save-contact-btn">Save Contact</button>

        <div class="socials">
            <!-- <div class="social-container">
                <div class="details">
                    <h3></h3>
                    <p></p>
                </div>
            </div> -->
            <div class="social-container">
                <div class="details">
                    <h3>Call me</h3>
                    <p>+1 (555) 123-4567</p>
                </div>
                <div class="details">
                    <h3>Visit our website</h3>
                    <p>www.shpe-gsfv.org</p>
                </div>
                <div class="details">
                    <h3>Linkedin</h3>
                    <p></p>
                </div>
                
            </div>
        </div>
    </div>

   <script>
        document.getElementById('save-contact-btn').addEventListener('click', function() {
            const vCardData = 
            `BEGIN:VCARD
            VERSION:3.0
            FN: Dominic Gallardo
            ORG:SHPE GSFV
            TITLE:President
            TEL;TYPE=CELL:+1-555-123-4567
            TEL;TYPE=WORK:+1-555-123-4567
            EMAIL:president@shpe-gsfv.org
            URL:www.shpe-gsfv.org
            End:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard' });

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Dominic_Gallardo.vcf';
            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        })
   </script>
</body>
</html>
